# Dev profile only (--spring.profiles.active=dev). Never enable this outside local testing.

# POST /auth/dev-login: username + password -> Gateway session, so Postman can get a session
# without a browser. See com.fahim.gateway.devlogin.
secure-shop.dev-login.enabled=true

# The password grant runs against the dev-only test client, never secure-shop-gateway, which stays
# Authorization-Code-only. Refreshes for dev sessions also go through this registration, since a
# refresh token only works for the client that issued it.
spring.security.oauth2.client.registration.keycloak-test.provider=keycloak
spring.security.oauth2.client.registration.keycloak-test.client-id=secure-shop-test-client
spring.security.oauth2.client.registration.keycloak-test.client-secret=${KEYCLOAK_TEST_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak-test.authorization-grant-type=password
spring.security.oauth2.client.registration.keycloak-test.scope=openid
