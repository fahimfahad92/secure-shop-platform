spring.application.name=gateway

server.port=8090

# Browser login client. The registration id must stay "keycloak": the redirect URI registered on
# the secure-shop-gateway client in Keycloak is http://localhost:8090/login/oauth2/code/keycloak.
# Only openid is requested; Keycloak adds the client's default scopes (orders:read, orders:write,
# secure-shop-audience, profile, email, roles) on its own.
spring.security.oauth2.client.registration.keycloak.client-id=secure-shop-gateway
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_GATEWAY_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid

# Discovery runs at startup (endpoints, JWKS, end_session_endpoint for logout), so Keycloak must be
# up before the Gateway starts.
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/secure-shop
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# The session cookie is the only credential the browser holds.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

order-service.base-url=http://localhost:8080
product-service.base-url=http://localhost:8082
user-service.base-url=http://localhost:8083
