spring.application.name=user-service

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/secure_shop?currentSchema=user_schema
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=user_schema
spring.jpa.show-sql=true

# No Open Session in View: a connection is held only while a repository call (or a transaction)
# runs, not for the whole request. Finding #4; precondition for ADR-0015 (no @Transactional).
spring.jpa.open-in-view=false

# HikariCP, sized for 3 services on one local Postgres. Finding #29; values in docs/development.md.
spring.datasource.hikari.pool-name=user-service-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
# Fail fast with 503 instead of tying up a web thread for Hikari's default 30 s.
spring.datasource.hikari.connection-timeout=3000
# Logs a WARN with the borrowing stack trace for any connection held over 2 s. On in every
# environment, tests included: it is how ADR-0015 checks that no connection is held across slow work.
spring.datasource.hikari.leak-detection-threshold=2000

spring.flyway.schemas=user_schema
spring.flyway.default-schema=user_schema

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/secure-shop
# Reject tokens not minted for this service: Keycloak puts each service name in `aud`
# via the secure-shop-audience client scope. Missing or wrong audience -> 401.
spring.security.oauth2.resourceserver.jwt.audiences=user-service

# Keycloak Admin API access. The secret has no default on purpose: a missing
# KEYCLOAK_ADMIN_CLIENT_SECRET fails startup instead of failing the first registration. That check
# lives in KeycloakAdminProperties: on its own, Boot would bind the unresolved ${...} as literal text.
keycloak.admin.base-url=http://localhost:8081
keycloak.admin.realm=secure-shop
keycloak.admin.client-id=user-service-admin-client
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
keycloak.admin.connect-timeout-ms=2000
keycloak.admin.read-timeout-ms=5000
