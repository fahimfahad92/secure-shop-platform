spring.application.name=user-service

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/secure_shop?currentSchema=user_schema
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=user_schema
spring.jpa.show-sql=true

spring.flyway.schemas=user_schema
spring.flyway.default-schema=user_schema

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/secure-shop
# Reject tokens not minted for this service: Keycloak puts each service name in `aud`
# via the secure-shop-audience client scope. Missing or wrong audience -> 401.
spring.security.oauth2.resourceserver.jwt.audiences=user-service

# Keycloak Admin API access. The secret has no default on purpose: a missing
# KEYCLOAK_ADMIN_CLIENT_SECRET fails startup instead of failing the first registration.
keycloak.admin.base-url=http://localhost:8081
keycloak.admin.realm=secure-shop
keycloak.admin.client-id=user-service-admin-client
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
keycloak.admin.connect-timeout-ms=2000
keycloak.admin.read-timeout-ms=5000
