spring.application.name=product-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/secure_shop?currentSchema=product_schema
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=product_schema
spring.jpa.show-sql=true

# No Open Session in View: a connection is held only while a repository call (or a transaction)
# runs, not for the whole request. Finding #4; precondition for ADR-0015 (no @Transactional).
spring.jpa.open-in-view=false

# HikariCP, sized for 3 services on one local Postgres. Finding #29; values in docs/development.md.
spring.datasource.hikari.pool-name=product-service-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
# Fail fast with 503 instead of tying up a web thread for Hikari's default 30 s.
spring.datasource.hikari.connection-timeout=3000
# Logs a WARN with the borrowing stack trace for any connection held over 2 s. On in every
# environment, tests included: it is how ADR-0015 checks that no connection is held across slow work.
spring.datasource.hikari.leak-detection-threshold=2000

spring.flyway.schemas=product_schema
spring.flyway.default-schema=product_schema

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/secure-shop
# Reject tokens not minted for this service: Keycloak puts each service name in `aud`
# via the secure-shop-audience client scope. Missing or wrong audience -> 401.
spring.security.oauth2.resourceserver.jwt.audiences=product-service
