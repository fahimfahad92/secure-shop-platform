spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5432/secure_shop?currentSchema=order_schema
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=order_schema
spring.jpa.show-sql=true

spring.flyway.schemas=order_schema
spring.flyway.default-schema=order_schema

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/secure-shop
# Reject tokens not minted for this service: Keycloak puts each service name in `aud`
# via the secure-shop-audience client scope. Missing or wrong audience -> 401.
spring.security.oauth2.resourceserver.jwt.audiences=order-service

product-service.base-url=http://localhost:8082
product-service.connect-timeout-ms=2000
product-service.read-timeout-ms=3000
